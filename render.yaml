# Optional Render deployment blueprint for the keyless Express place proxy.
# Deploy the Vite `client/dist` output on any static host and set
# VITE_API_URL to this service URL at build time.
services:
  - type: web
    name: foodie-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: OVERPASS_USER_AGENT
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
